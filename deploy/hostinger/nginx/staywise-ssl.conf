map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name staywise.miami www.staywise.miami admin.staywise.miami api.staywise.miami;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name staywise.miami;

  ssl_certificate /etc/letsencrypt/live/staywise.miami/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staywise.miami/privkey.pem;

  return 301 https://www.staywise.miami$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.staywise.miami;

  ssl_certificate /etc/letsencrypt/live/staywise.miami/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staywise.miami/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.staywise.miami;

  ssl_certificate /etc/letsencrypt/live/staywise.miami/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staywise.miami/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name api.staywise.miami;
  client_max_body_size 25m;

  ssl_certificate /etc/letsencrypt/live/staywise.miami/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staywise.miami/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
